[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
env_logger = "0.11"
http = "1"
log = "0.4"
nacos-client = { path = "../crates/nacos-client" }
pingora = { version = "=0.9.1", features = ["proxy", "rustls"] }
redis = { version = "0.32", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
futures-util = "0.3"
rcgen = "0.14"
tokio-tungstenite = "0.26"
