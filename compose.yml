services:
  alisten:
    image: ghcr.io/bihua-university/alisten:latest
    build:
      context: .
      dockerfile: docker/alisten.Dockerfile
    container_name: alisten
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:?NACOS_SERVER_ADDR is required}
      - ALISTEN_CONFIG=alisten.json
      - PORT=8080
      - DEBUG=${DEBUG:-false}
      - ADDR=${ADDR:-}
      - TOKEN=${TOKEN:-}
    ports:
      - "8080:8080"
    networks:
      - alisten-network
    depends_on:
      musichub:
        condition: service_started

  musichub:
    image: ghcr.io/bihua-university/musichub:latest
    build:
      context: .
      dockerfile: docker/musichub.Dockerfile
    container_name: musichub
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - NACOS_SERVER_ADDR=${NACOS_SERVER_ADDR:?NACOS_SERVER_ADDR is required}
      - MUSICHUB_CONFIG=musichub.json
      - PORT=9090
      - DEBUG=${DEBUG:-false}
    networks:
      - alisten-network

networks:
  alisten-network:
    driver: bridge
