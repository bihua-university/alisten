services:
  # Alisten 服务
  alisten:
    image: ghcr.io/bihua-university/alisten:latest
    container_name: alisten
    volumes:
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - SNAPSHOT_URL=http://alisten-snapshot:9090
    ports:
      - "8080:8080"
    networks:
      - alisten-network

  # Musiclet-py 工作服务
  musiclet-py:
    image: musiclet-py:latest
    container_name: alisten-musiclet-py
    volumes:
      - ./musiclet-config.json:/app/config.json:ro
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    networks:
      - alisten-network

  # Snapshot 状态存储服务
  alisten-snapshot:
    build:
      context: .
      dockerfile: docker/snapshot.Dockerfile
    container_name: alisten-snapshot
    volumes:
      - snapshot-data:/app/snapshots
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "9090:9090"
    networks:
      - alisten-network

volumes:
  snapshot-data:

networks:
  alisten-network:
    driver: bridge
