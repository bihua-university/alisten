syntax = "proto3";

package nacos.v1;

option go_package = "github.com/bihua-university/alisten/internal/proto/nacos;nacos";

message Empty {}

message ConfigRequest {
  string data_id = 1;
  string group = 2;
}

message ConfigReply {
  string content = 1;
}

message PublishConfigRequest {
  string data_id = 1;
  string group = 2;
  string content = 3;
  string type = 4;
}
